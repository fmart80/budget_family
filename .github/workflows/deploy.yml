# Tests à chaque pull request, puis déploiement automatique sur KreativMedia (FTP)
# à chaque mise à jour de la branche main.
#
# Secrets à créer dans GitHub : Settings → Secrets and variables → Actions → New repository secret
#   FTP_HOST       serveur FTP (le même que dans FileZilla), ex. votre-domaine.ch
#   FTP_USER       utilisateur FTP (Plesk → Accès FTP)
#   FTP_PASSWORD   mot de passe FTP
#   FTP_PATH       dossier de l'application sur le serveur, ex. httpdocs/budget
#   FTP_PORT       (facultatif) 21 par défaut
#   FTP_SECURITY   (facultatif) chiffrement de la connexion :
#                    tls          (défaut) FTP chiffré (FTPS explicite), certificat vérifié
#                    tls-noverify FTP chiffré, certificat non vérifié (certificat Plesk au nom du serveur)
#                    none         FTP non chiffré : mot de passe en clair, à éviter
#
# Les fichiers propres au serveur ne sont jamais envoyés ni supprimés :
# config/config.php (accès à la base) et storage/uploads/ (factures jointes).

name: Tests et déploiement

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: error_reporting=E_ALL, display_errors=On
          extensions: mbstring, dom, pdo_mysql, zip
          coverage: none

      - name: Vérification de la syntaxe PHP
        run: find app public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests des imports et des calculs
        run: |
          php tests/run.php 2>&1 | tee test-output.txt
          if grep -qE "(Deprecated|Warning|Notice):" test-output.txt; then
            echo "::error::Avertissements PHP détectés (incompatibilité avec PHP ${{ matrix.php }})."
            exit 1
          fi

  deploy:
    name: Déploiement KreativMedia
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Vérification des secrets
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_PATH" ]; then
            echo "::warning::Secrets FTP non configurés : déploiement ignoré. Voir l'en-tête de .github/workflows/deploy.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installation de lftp
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoi des fichiers par FTP
        if: steps.secrets.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURITY: ${{ secrets.FTP_SECURITY }}
        run: |
          case "${FTP_SECURITY:-tls}" in
            tls)          SECURITY="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;" ;;
            tls-noverify) SECURITY="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate false;"
                          echo "::warning::Certificat du serveur FTP non vérifié (FTP_SECURITY=tls-noverify)." ;;
            none)         SECURITY="set ftp:ssl-allow false;"
                          echo "::warning::FTP non chiffré : le mot de passe circule en clair (FTP_SECURITY=none)." ;;
            *)            echo "::error::FTP_SECURITY doit valoir tls, tls-noverify ou none."; exit 1 ;;
          esac
          export LFTP_PASSWORD="$FTP_PASSWORD"
          EXCLUDES="--exclude-glob .git/ --exclude-glob .github/ --exclude-glob tests/ --exclude-glob .gitignore --exclude config/config.php --exclude-glob storage/uploads/"
          CONNECT="set net:max-retries 3; set net:timeout 30; set ftp:passive-mode true; $SECURITY
            open --env-password -u '$FTP_USER' -p '${FTP_PORT:-21}' 'ftp://$FTP_HOST';"

          lftp -e "$CONNECT mirror --reverse --verbose --overwrite --no-perms $EXCLUDES ./ '$FTP_PATH'; bye"

          # Contrôle d'intégrité : fichiers présents sur le serveur mais absents du dépôt
          # (anciens fichiers, ou fichier déposé par un tiers). Rien n'est supprimé.
          lftp -e "$CONNECT mirror --reverse --dry-run --delete --no-perms $EXCLUDES ./ '$FTP_PATH'; bye" > dry-run.txt 2>&1 || true
          grep -E '^rm ' dry-run.txt | sed -E 's#^rm (-r )?ftp://[^/]*/##' > extra-files.txt || true
          if [ -s extra-files.txt ]; then
            echo "Fichiers présents sur le serveur mais absents du dépôt :"
            cat extra-files.txt
            if grep -qiE '\.(php[0-9]?|phtml|phar|pht)$|\.user\.ini$|\.htaccess$' extra-files.txt; then
              echo "::warning::Fichier PHP ou de configuration inconnu sur le serveur : vérifiez-le dans le journal de cette étape (fichier ancien ou déposé par un tiers ?)."
            fi
          else
            echo "Contrôle d'intégrité : aucun fichier inattendu sur le serveur."
          fi

      - name: Fin du déploiement
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "Déploiement terminé. Ouvrez votre site : les mises à jour de la base s'appliquent au premier chargement."
