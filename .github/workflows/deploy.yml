# Tests à chaque pull request, puis déploiement automatique sur KreativMedia (FTP)
# à chaque mise à jour de la branche main.
#
# Secrets à créer dans GitHub : Settings → Secrets and variables → Actions → New repository secret
#   FTP_HOST       serveur FTP (le même que dans FileZilla), ex. votre-domaine.ch
#   FTP_USER       utilisateur FTP (Plesk → Accès FTP)
#   FTP_PASSWORD   mot de passe FTP
#   FTP_PATH       dossier de l'application sur le serveur, ex. httpdocs/budget
#   FTP_PORT       (facultatif) 21 par défaut
#   FTP_SECURITY   (facultatif) chiffrement de la connexion :
#                    tls          (défaut) FTP chiffré (FTPS explicite), certificat vérifié
#                    tls-noverify FTP chiffré, certificat non vérifié (certificat Plesk au nom du serveur)
#                    none         FTP non chiffré : mot de passe en clair, à éviter
#
# Les fichiers propres au serveur ne sont jamais envoyés ni supprimés :
# config/config.php (accès à la base) et storage/uploads/ (factures jointes).

name: Tests et déploiement

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, pdo_mysql, zip
          coverage: none

      - name: Vérification de la syntaxe PHP
        run: find app public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Tests des imports et des calculs
        run: php tests/run.php

  deploy:
    name: Déploiement KreativMedia
    needs: tests
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérification des secrets
        id: secrets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_PATH" ]; then
            echo "::warning::Secrets FTP non configurés : déploiement ignoré. Voir l'en-tête de .github/workflows/deploy.yml."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installation de lftp
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoi des fichiers par FTP
        if: steps.secrets.outputs.ready == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURITY: ${{ secrets.FTP_SECURITY }}
        run: |
          case "${FTP_SECURITY:-tls}" in
            tls)          SECURITY="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;" ;;
            tls-noverify) SECURITY="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate false;"
                          echo "::warning::Certificat du serveur FTP non vérifié (FTP_SECURITY=tls-noverify)." ;;
            none)         SECURITY="set ftp:ssl-allow false;"
                          echo "::warning::FTP non chiffré : le mot de passe circule en clair (FTP_SECURITY=none)." ;;
            *)            echo "::error::FTP_SECURITY doit valoir tls, tls-noverify ou none."; exit 1 ;;
          esac
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -e "
            set net:max-retries 3;
            set net:timeout 30;
            set ftp:passive-mode true;
            $SECURITY
            open --env-password -u '$FTP_USER' -p '${FTP_PORT:-21}' 'ftp://$FTP_HOST';
            mirror --reverse --verbose --overwrite --no-perms \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob tests/ \
              --exclude-glob .gitignore \
              --exclude config/config.php \
              --exclude-glob storage/uploads/ \
              ./ '$FTP_PATH';
            bye
          "

      - name: Fin du déploiement
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "Déploiement terminé. Ouvrez votre site : les mises à jour de la base s'appliquent au premier chargement."
