; Durcissement PHP pour l'application (lu par PHP-FPM / CGI, pris en compte en quelques minutes).
; Ne remplace pas la mise à jour de PHP par l'hébergeur.

; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) : fonction non utilisée par l'application,
; désactivée pour réduire la surface d'attaque.
session.upload_progress.enabled = 0

; Taille maximale des requêtes : factures jointes (10 Mo) et relevés bancaires (5 Mo).
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5

; Ne pas annoncer la version de PHP dans les en-têtes HTTP.
expose_php = 0
